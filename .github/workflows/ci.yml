name: ci

# Enterprise CI gate for egl-utils-java, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on main (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Bootstrap guard (#313). Roadmap item 1.1 lays down the build system; until it lands there
  # is nothing for the toolchain jobs to build, so they SKIP rather than fail. A wall of red on
  # the bootstrap PR is not just noise — it teaches that red CI on this repo is normal, which is
  # the opposite of what every other gate here is for. The moment `pom.xml` exists
  # every job below runs for real, with no edit to this workflow or to the profile.
  # ---------------------------------------------------------------------------
  bootstrap:
    name: bootstrap / is the build system in place?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: probe
        shell: bash
        run: |
          # compgen -G matches a literal name AND a glob, so a profile may declare either.
          if compgen -G "pom.xml" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bootstrap pending::pom.xml is not present yet, so the toolchain jobs are skipped. They start running by themselves once roadmap item 1.1 lands the build system."
          fi

  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: temurin-17, preset: test }
          - { os: ubuntu-24.04, toolchain: temurin-21, preset: test }
          - { os: windows-2022, toolchain: temurin-17, preset: test }
          - { os: windows-2022, toolchain: temurin-21, preset: test }
          - { os: macos-14, toolchain: temurin-17, preset: test }
          - { os: macos-14, toolchain: temurin-21, preset: test }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.toolchain == 'temurin-17' && '17' || '21' }}
          cache: maven

      - name: Build
        shell: bash
        run: mvn -B clean verify

      - name: Test
        shell: bash
        run: mvn -B test

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  quality:
    name: quality / spotless + errorprone + checkstyle + jacoco + pit
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: { distribution: temurin, java-version: '21', cache: maven }
      # Two commands, not one, because their module scope differs — see commands.format_check.
      - run: mvn -B spotless:check -pl '!d4np-bom'
      - run: mvn -B checkstyle:check
      # NOTE: -Pcoverage and -Pmutation do not exist yet; Maven only WARNS on an unmatched
      # profile, so these two steps pass having measured nothing. ROADMAP item 8.2 owns them.
      - run: mvn -B verify -Pcoverage
      - run: mvn -B -Pmutation test
  # Item 1.5. The rendered `build` matrix runs only build + test (that is the template's shape,
  # and .eados-core/ is upstream tooling this project does not edit), but item 1.5 asks the matrix
  # to cover format + lint too. This job supplies that half as project-owned data.
  #
  # WHY IT IS WORTH RUNNING MORE THAN ONCE: formatting is not as platform-independent as it looks.
  # Spotless defaults to lineEndings=GIT_ATTRIBUTES and this repo has NO .gitattributes, so the
  # line endings Spotless sees come from git's checkout behaviour — which differs on Windows.
  # A formatting rule that passes on Linux and fails on Windows is exactly the class of defect a
  # single-platform format job cannot see.
  #
  # ubuntu + windows, NOT macOS: the divergence being hunted is CRLF-vs-LF and path separators, so
  # Windows is the informative case while macOS and Linux are both POSIX/LF. Adding macOS here
  # would bill the highest-multiplier runner for a duplicate of the Linux answer.
  #
  # JDK 21 only: google-java-format and Checkstyle are libraries whose verdicts do not depend on
  # the JDK running them, so a second toolchain here would cost twice and prove nothing.
  format-lint:
    name: format-lint / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: { distribution: temurin, java-version: '21', cache: maven }
      # shell: bash on both platforms so the '!d4np-bom' quoting has one meaning: PowerShell would
      # not treat these single quotes the same way, and cmd would pass them through literally.
      - name: Format check
        shell: bash
        run: mvn -B spotless:check -pl '!d4np-bom'
      - name: Lint
        shell: bash
        run: mvn -B checkstyle:check
  jcstress:
    name: jcstress / concurrency stress
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -Pjcstress verify
  compatibility:
    name: compatibility / enforcer + japicmp
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B enforcer:enforce
      - run: mvn -B japicmp:cmp
  security:
    name: security / owasp dependency-check
    runs-on: ubuntu-24.04
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B dependency-check:check

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  benchmark:
    name: benchmark / reproducible perf
    needs: bootstrap
    if: needs.bootstrap.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ matrix.toolchain == 'temurin-17' && '17' || '21' }}
          cache: maven
      - name: Run the benchmark suite
        shell: bash
        run: mvn -B -Pjmh verify


  # Data-race / concurrency gate — runs only when the project exposes concurrency.
  

