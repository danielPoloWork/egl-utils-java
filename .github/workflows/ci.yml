name: ci

# Enterprise CI gate for egl-utils-java, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on main (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: temurin-17, preset: test }
          - { os: ubuntu-24.04, toolchain: temurin-21, preset: test }
          - { os: windows-2022, toolchain: temurin-21, preset: test }
          - { os: macos-14, toolchain: temurin-21, preset: test }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.toolchain == 'temurin-17' && '17' || '21' }}
          cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}

      - name: Build
        shell: bash
        run: mvn -B clean verify

      - name: Test
        shell: bash
        run: mvn -B test

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  quality:
    name: quality / spotless + errorprone + checkstyle + jacoco + pit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: "${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}" }
      - run: mvn -B spotless:check checkstyle:check
      - run: mvn -B verify -Pcoverage
      - run: mvn -B -Pmutation test
  jcstress:
    name: jcstress / concurrency stress
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: "${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}" }
      - run: mvn -B -Pjcstress verify
  compatibility:
    name: compatibility / enforcer + japicmp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: "${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}" }
      - run: mvn -B enforcer:enforce
      - run: mvn -B japicmp:cmp
  security:
    name: security / owasp dependency-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: "${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}" }
      - run: mvn -B dependency-check:check

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  benchmark:
    name: benchmark / reproducible perf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.toolchain == 'temurin-17' && '17' || '21' }}
          cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}
      - name: Run the benchmark suite
        shell: bash
        run: mvn -B -Pjmh verify


  # Data-race / concurrency gate — runs only when the project exposes concurrency.
  

