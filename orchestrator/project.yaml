# project.yaml — the single source of truth for this project.
#
# Framed by `/eados init` (interview Phase 0). Deeper sections (ownership, language,
# toolchain, ci, spec, …) are added by their phases (interview Phases 1–5); an omitted
# section derives no override and needs no provenance entry until it is settled (#201).

schema_version: 1
manifest_rev: 3              # bumped with the plan -> scaffold transition recorded below. The write was
                             # guarded (#214): re-proposed with --expect-rev 2 immediately beforehand,
                             # which confirmed no other session had moved the rev.
domain: software             # development target (Q0.4) -> .eados-core/orchestrator/domains/software.yaml

# delivery_state holds STATE + cross-link REFS (ids), never content (RFC-0001 §8).
delivery_state:
  phase: scaffold            # init|design|plan|scaffold|audit|migrate — the acting role is now
                             # enterprise-architect (owns AGENTS.md, docs/adr/**, .github/**, tools/**,
                             # .eados-core/**), no longer producer. NOTE scaffold -> audit is the ONE
                             # transition in the machine with human_gate: false.
  # Transition ledger (#199) — a legal, contiguous chain ending at `phase`. A human-gated move carries
  # confirmed_by AND gate_results, so the record is evidence rather than honour (#250). Emitted verbatim
  # by `phase_runner --propose design`; the owner's confirmation substitutes for the <owner> placeholder.
  checkpoints:
    - { from: init, to: design, gates: ['manifest-valid'], at: 2026-07-26, confirmed_by: danielPoloWork, gate_results: { manifest-valid: OK } }
    - { from: design, to: plan, gates: ['rfc-approved'], at: 2026-07-27, confirmed_by: danielPoloWork, gate_results: { rfc-approved: OK } }
    - { from: plan, to: scaffold, gates: ['roadmap-covers-rfcs'], at: 2026-07-27, confirmed_by: danielPoloWork, gate_results: { roadmap-covers-rfcs: OK } }
  # ^ emitted verbatim by `phase_runner --propose plan --rfc docs/rfc/0001-core-contracts.md
  #   --expect-rev 1`; the owner's in-session confirmation substitutes for the <owner> placeholder.
  #   gate_results is EVIDENCE, not honour (#250): rfc-approved=OK was computed live by rfc_check
  #   against docs/rfc/0001-core-contracts.md, whose approval record the owner authorized. CAVEAT
  #   the gate cannot see: rfc_check is STRUCTURAL — it verifies the record exists and names the
  #   approver role. Procedure step 3 (independent reviewer / enterprise-architect findings) did
  #   NOT run for RFC-0001; the RFC's own Approval section states this. The OK is therefore honest
  #   about what it checked and silent about peer review, which never happened.
  # NAMING COLLISION, disambiguated: the `RFC-0001` in the comment on line 13 is EADOS's OWN
  # RFC-0001 (the delivery-OS design, .eados-core/docs/rfc/0001-eados-delivery-os.md). The
  # `RFC-0001` in `rfcs` below is THIS PROJECT's, docs/rfc/0001-core-contracts.md. Same id, two
  # contracts — the two-contracts rule (AGENTS.md §preamble). traceability.py matches only the
  # list values, never the comments, so the collision is cosmetic; it is spelled out so a reader
  # does not conflate them.
  # `milestones` are the ROADMAP.md milestone ids (`## Milestone N` sections), populated by the plan
  # phase. These are ROADMAP ids, NOT GitHub milestone titles — the two are distinct and the repo has
  # only one GitHub milestone (v0.1.0) against eight roadmap milestones. The traceability graph edge
  # rfc -> milestone is derived from ROADMAP.md by traceability.covering_milestones (which returns
  # bare numbers; doctor.py prefixes the M), so nothing parses the list below — it is the recorded
  # cross-link, read by doctor.py for the status readout.
  refs: { rfcs: ['RFC-0001'], milestones: ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7', 'M8'], prs: [1, 4, 7], releases: [] }
  # PR #1 = the bootstrap PR; PR #4 = landed RFC-0001; PR #7 = landed ROADMAP.md (traceability edges).
  # Coverage today is RFC-0001 -> M2 only. M1 is governed by ADR-001 + ADR-004 rather than an RFC
  # (both Accepted — an RFC there would re-decide an accepted ADR); M3-M7 each open with an RFC item
  # (3.0, 4.0, 5.0, 6.0, 7.0) that BLOCKS their implementation items, and M8 is plumbing for
  # normatively-specified NFRs. So five RFCs are owed, and each is a legal `plan -> design` return
  # (workflow.yaml makes that edge resumable and NOT human-gated). Recorded here so the gap is state,
  # not folklore: `refs.rfcs` will grow to RFC-0002..0006 as those items land.

identity:
  # Scope reconciled 2026-07-26: the maintainer confirmed `.spec/d4np-java.md` (reviewed draft
  # v2.0) is THIS repo's specification, renamed from `d4np-java` into the EGL series. The prior
  # "general-purpose utilities" framing understated the scope (only items 22-25 of the spec's 25
  # are utility helpers) and was replaced; title + tagline are imported from the spec §title/§1.
  project_name:    "egl-utils-java"                    # the repository/directory name on disk, unchanged
                                                       # NOTE: "-utils-" now under-describes the scope;
                                                       # renaming the repo is the maintainer's call, not the agent's
  project_slug:    "util"                              # SETTLED by the maintainer via the requested source path
                                                       # "src/main/java/it/d4np/util" (my earlier `egl` proposal is
                                                       # withdrawn). Read `util` as the FAMILY name, not a
                                                       # description of contents — modules land at it.d4np.util.core,
                                                       # .jdbc, .security, … (the commons-lang3 convention).
                                                       # Dissent on record, maintainer's call stands: see the
                                                       # namespace note in the hand-off.
  project_title:   "Java Enterprise Architecture Library"
  project_tagline: "A modular set of Java libraries implementing enterprise design patterns for Spring Boot and Jakarta EE systems — a zero-dependency core plus opt-in capability modules (JDBC, concurrency, security, JSON) and framework adapters."
  project_series:  "Enterprise-Grade Libraries"        # proposed from the parent directory (EGL family)
  project_kind:    library                             # Q0.2 — a set of libraries; still `library`

ownership:                   # Phase 4 (Q4.1/Q4.2) — every field below was stated or explicitly confirmed by the
                             # maintainer on 2026-07-26; the licence facts were cross-checked against ./LICENSE.
  owner:           "danielPoloWork"   # CONFIRMED — the personal account, not an org. Load-bearing: it is the
                                      # CODEOWNERS fallback for the contribution policy
                                      # (os/contribution/contribution.yaml owner_identity.manifest_fallback),
                                      # and it REMAINS the live fallback until scaffold writes .github/CODEOWNERS.
  maintainer:      "Daniel Polo"      # from LICENSE + the configured git user
  author:          "Daniel Polo"      # from LICENSE: "Copyright (c) 2026 Daniel Polo"
  year:            "2026"             # from LICENSE
  license_id:      MIT                # CONFIRMED — keep MIT, decided deliberately over Apache-2.0. The agent
                                      # recommended Apache-2.0 (express patent grant; matches the Spring/Jackson/
                                      # Nimbus/Redisson neighbourhood); the maintainer chose MIT and accepts the
                                      # no-patent-grant posture. Seed this as a project ADR at scaffold time so the
                                      # tradeoff is on record, and keep LICENSE + the POM <licenses> block in step.
  default_branch:  main               # CONFIRMED — and now REALITY, not aspiration. The earlier note here flagged a
                                      # DIVERGENCE (local repo and GitHub still on `master`) and a 3-step rename the
                                      # maintainer owed before scaffold. That rename has been run; the note was stale
                                      # and is replaced by its verification. Checked 2026-07-27: `git branch -a` shows
                                      # no `master` local or remote, `origin/HEAD -> origin/main`, and
                                      # `gh repo view --json defaultBranchRef` returns main. The scaffold prerequisite
                                      # this field carried is therefore SATISFIED — generated CI may target `main`.
  assignee:        "danielPoloWork"   # follows `owner`; never "@me" (it resolves to whichever actor runs gh)

language:                    # Phase 1 — settled from "src/main/java/it/d4np/util" (Q1.1 + Q1.3 in one answer).
  lang:            java
  lang_name:       "Java 21 (LTS)"
  lang_standard:   "Java 21 (LTS) toolchain; --release 17 language/bytecode baseline"
                             # Q1.1 follow-up (runtime floor): the maintainer delegated the call. Recommendation
                             # taken: keep the 17 floor, build/test on 21. This is what BOTH independent sources
                             # already say — profiles/java.yaml `default_standard` ("Java 21 (LTS), --release 17
                             # floor") and the spec's own §1.1 compatibility matrix ("17 baseline, 21 tested in
                             # CI"). A 21 floor would exclude Spring Boot 3.2+ hosts still on 17 LTS, and no
                             # functional item needs a 21-only feature. Raising the floor later is a MAJOR bump;
                             # lowering it never is — so starting at 17 keeps the option open.
  secondary_lang:  ""        # Q1.2 — none. `d4np-jdbc` executes the CALLER's SQL; it owns no schema of its own,
                             # so SQL is not a declared secondary language here.
  group_path:      "it/d4np"          # Q1.3 — stated by the maintainer (their own reverse domain, not a fallback)
  group_dotted:    "it.d4np"
  namespace:       "it.d4np.util"     # profiles/java.yaml namespace_pattern: {group_dotted}.{project_slug}
  src_ext:         java
  comment_lang:    "en"      # Q4.7 default, echoed for confirmation; identifiers/API/commits stay English anyway
  public_include_hint: "import it.d4np.util.*;"   # profile import_idiom
# Derived: src_main = src/main/java/it/d4np/util   (matches the path the maintainer specified)

# --- Phase 2 (Frameworks) is recorded across the fields it actually drives, per the questionnaire:
# Q2.1 frameworks -> toolchain + spec.architecture; Q2.2 concurrency -> capabilities.threading;
# Q2.3 public surface -> capabilities.public_api + ci.tier1_platforms. Answers, for the record:
#   Q2.1  Jakarta EE 10 (Bean Validation 3.x, `provided` in core); Jackson (json); Nimbus JOSE+JWT
#         (security); Redisson (lock-redisson); Micrometer (metrics); Spring Boot 3.2+ / spring-web,
#         spring-context, AspectJ (spring-adapter, `provided` scope only); H2 (test scope).
#         core itself stays "standard library only" — the ADR-001 zero-dependency stance.
#   Q2.2  THREADS, not a reactive runtime: java.util.concurrent pools + CompletableFuture async,
#         MDC propagation. Race tooling = jcstress (the profile's TSan analogue). -> threading: true
#   Q2.3  Stable public API AND binary compatibility — japicmp gates it per module, the BOM is the
#         consumer-facing versioning contract. Consumers: Spring Boot 3.2+ and plain Jakarta EE /
#         JDBC hosts on JDK 17+. -> public_api: true

toolchain:                   # Phase 3. Profile defaults from profiles/java.yaml EXCEPT where the
                             # imported spec overrides them — each override is marked and sourced.
  build_tool:      "Maven 3.9+ (multi-module reactor)"
                             # OVERRIDE of the profile's Gradle default. Not a preference: the spec
                             # mandates maven-enforcer (§3 rules), japicmp (§8) and a `bom` artifact
                             # (ADR-001), all Maven-native. The spec is authoritative on scope, so the
                             # profile default loses here (precedence: manifest > profile default).
  pkg_manager:     "Maven Central via Sonatype; GPG-signed artifacts, sources + javadoc JARs"
  test_framework:  "JUnit 5 + AssertJ; jqwik (property tests); jcstress (concurrency); H2 (JDBC integration)"
  formatter:       "Spotless (google-java-format)"                       # profile default
  linter:          "ErrorProne + NullAway + Checkstyle; maven-enforcer for the ADR-001 dependency rules"
  sanitizers:      "ErrorProne/NullAway (compile-time soundness), jcstress (concurrency), JFR leak profiling, OWASP Dependency-Check"
  coverage_tool:   "JaCoCo (line) + PIT (mutation)"
  coverage_target: 85        # OVERRIDE of the template's 80 — spec §8 states JaCoCo >= 85% line.
                             # PIT >= 60% on core + security is a separate gate (NFR-10), not a
                             # single percentage, so it lives in the NFR rather than this field.
  doc_tool:        "Javadoc"                                             # profile default
  version_file:    "pom.xml"
                             # OVERRIDE of the profile's Version.java: in a Maven reactor the parent
                             # POM is the single source of the version. Safe — render.py passes
                             # VERSION_FILE/VERSION_CONST_HINT through as scalars with no logic.
  version_const_hint: "<version>X.Y.Z</version>"
  package_ecosystem: "maven" # Dependabot ecosystem; profiles/java.yaml explicitly anticipates this
                             # override ("use \"maven\" if Maven-built").
  commands:                  # Maven equivalents of the profile's ./gradlew commands
    build:        "mvn -B clean verify"
    test:         "mvn -B test"
    format_check: "mvn -B spotless:check"
    lint:         "mvn -B checkstyle:check"   # ErrorProne/NullAway bind into compilation, so they
                                              # also run as part of `build`
    bench:        "mvn -B -Pjmh verify"       # JMH harnesses under bench/ (capabilities.bench)

ci:                          # Profile matrix, re-pointed from Gradle to Maven caching.
  tier1_platforms: "Linux / Windows / macOS on Temurin JDK 17 & 21"
  matrix:
    - { os: ubuntu-24.04, toolchain: "temurin-17", preset: test }
    - { os: ubuntu-24.04, toolchain: "temurin-21", preset: test }
    - { os: windows-2022, toolchain: "temurin-21", preset: test }
    - { os: macos-14,     toolchain: "temurin-21", preset: test }
  # NOTE deliberately NOT added: Temurin 25. JDK 25 is the current LTS and testing it would be
  # additive (the published baseline stays 17), but spec §1.1 names "17 baseline, 21 tested in CI"
  # as the compatibility contract. Amending that contract is the maintainer's call, not a silent
  # toolchain tweak — so the matrix follows the spec and the recommendation stays on record.
  # CACHE IS CONDITIONAL, and that is a fix, not a style choice. actions/setup-java@v4 with a
  # `cache:` value HARD-ERRORS when no manifest matches its glob — the bootstrap CI failed with
  # "No file in ... matched to [**/pom.xml]" at the SETUP step, before any build command ran. The
  # factory renders no build-manifest template for any language (there is no pom/gradle/cargo
  # template in .eados-core/templates/), so a cache directive keyed to one cannot succeed until
  # Milestone 1 creates it. An empty `cache:` value disables caching, so this expression skips the
  # cache before pom.xml exists and enables it automatically the moment item 1.2 lands — no
  # follow-up edit needed. Applies to the `benchmark` job too: the ci.yml template injects these
  # same setup steps there.
  setup_steps: |
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ matrix.toolchain == 'temurin-17' && '17' || '21' }}
        cache: ${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}
  extra_jobs: |
    quality:
      name: quality / spotless + errorprone + checkstyle + jacoco + pit
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v4
          with: { distribution: temurin, java-version: '21', cache: "${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}" }
        - run: mvn -B spotless:check checkstyle:check
        - run: mvn -B verify -Pcoverage
        - run: mvn -B -Pmutation test
    jcstress:
      name: jcstress / concurrency stress
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v4
          with: { distribution: temurin, java-version: '21', cache: "${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}" }
        - run: mvn -B -Pjcstress verify
    compatibility:
      name: compatibility / enforcer + japicmp
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v4
          with: { distribution: temurin, java-version: '21', cache: "${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}" }
        - run: mvn -B enforcer:enforce
        - run: mvn -B japicmp:cmp
    security:
      name: security / owasp dependency-check
      runs-on: ubuntu-24.04
      steps:
        - uses: actions/checkout@v6
        - uses: actions/setup-java@v4
          with: { distribution: temurin, java-version: '21', cache: "${{ hashFiles('**/pom.xml') != '' && 'maven' || '' }}" }
        - run: mvn -B dependency-check:check

governance:
  posture: enterprise        # Q0.5 — ASKED and confirmed; raised governance/compliance bar (ADR-0015).
  # Q4.3 — PROPOSED BY THE AGENT, needs a nod: one scope per reactor module (ADR-001) plus the
  # standard four. `testkit` names the d4np-test module deliberately — a `test` scope would collide
  # with `tests` (the standard scope for test-only changes) and make history ambiguous.
  scopes: [core, jdbc, concurrent, security, json, spring, redisson, testkit, bom, build, tests, docs, ci]
  # Q4.4 — questionnaire default taken. Coherent with the roadmap: M2-M7 are pre-release, so 0.x
  # correctly signals "binary compatibility not yet promised", and 1.0.0 becomes the M8 deliverable
  # once japicmp (8.1) is actually gating. Do NOT swap these two fields.
  version_start: "pre-1.0 milestone-driven"    # PROSE policy descriptor
  start_version: "0.0.0"                        # NUMERIC X.Y.Z seed
  house_rules: ""            # config/house-rules.md is empty -> no AGENTS.md §14 is emitted
  # Q4.5 — PR metadata policy confirmed as the default: assignee = the owner (never "@me"), exactly
  # one type label, the open per-release milestone, and a Project once one exists (none today).
  # Reviewers stay deferred until there is a second collaborator, matching upstream practice.
  capabilities:              # Each flag below is FORCED by the imported spec, not assumed:
    bench:      true         # JMH harnesses under bench/, NFR-01..04/06 (spec §6)
    threading:  true         # concurrent module + a named jcstress test per thread-safety claim
    public_api: true         # published library; japicmp guards binary compatibility (NFR-09)
    packaging:  true         # Maven Central via Sonatype, GPG-signed (NFR-12)
    i18n:       false        # Q4.7 — no extra doc languages named
    service:    false        # a library, not a service
    announce:   false        # Q4.8 default
    layered:    false        # Q5.4a — a library keeps the flat shape; the split is Maven-level
    api_spec:   false        # no OpenAPI/IDL surface — not a service or web project

i18n:                        # Q4.7, asked unconditionally (#150 / ADR-0016) and DEFAULTED — echoed
                             # here for confirmation, never applied silently.
  default_lang: "en"         # canonical on-disk doc language
  targets: []                # no translations; naming any target here is what would enable i18n.
                             # Note: identifiers, public API names, commits, branches and PR text
                             # stay English regardless of this setting (AGENTS.md §2).

announce:                    # Q4.8 — DEFAULTED off. If release announcements are wanted later,
                             # naming channels here sets capabilities.announce and seeds
                             # docs/workflow/announcements.md (agent drafts, human publishes).
  channels: []

spec:
  # Phase 5 via the Q5.0(a) IMPORT path: `.spec/d4np-java.md` (v2.0, 2026-07-14, "Reviewed draft")
  # plus its three accepted ADRs under `.spec/adr/`, mapped onto the six-section shape. Nothing here
  # was re-interviewed; items the document already settled are carried over verbatim in substance.
  # Gap audit results are marked [GAP] inline and MUST be closed before the spec is frozen.
  provenance:       import
  objective: |
    Give enterprise Java teams reusable, production-grade implementations of common enterprise
    design patterns — keyed factories, fluent builders, strategy registries, thread-safe lazy
    initialization, programmatic JDBC transactions, pooled/async execution, JWT and AES primitives,
    a Result-based error model, and conversion helpers — adoptable a la carte WITHOUT inheriting a
    framework. The pain removed is the dependency cost of the usual alternative: a monolithic
    utility JAR drags Spring MVC, Jackson, AspectJ and Redisson into every consumer, inflating
    dependency audits, CVE triage, and version conflicts against the host's own framework versions
    (ADR-001 context). Consumers are Spring Boot 3.2+ services and plain Jakarta EE / JDBC hosts on
    JDK 17+; `core` carries zero third-party dependencies, so a team can take one pattern without
    taking a framework. Framework independence is a build property enforced in CI, not a slogan.

  functional_reqs:
    # core — creational & structural
    - "FR-01 GenericFactory<T,K>: generic keyed factory. [GAP] no contract stated — unknown-key behavior, duplicate registration, and thread safety are undefined (item 4 got this treatment; item 1 did not)."
    - "FR-02 FluentBuilder<T>: base for fluent domain-object builders. [GAP] no contract stated — required-field enforcement, build() validation, and reuse-after-build are undefined."
    - "FR-03 Lazy<T>: thread-safe lazy initialization via double-checked volatile; initializer runs at most once; exceptions memoized-or-retried per option; initializer returning null raises IllegalStateException; safe publication jcstress-verified (NFR-01)."
    - "FR-04 StrategyRegistry<K,S>: Optional<S> find(K) for the missing-key case; S getOrThrow(K) throws StrategyNotFoundException carrying the known-keys list; ConcurrentHashMap-backed lock-free reads (NFR-04); register is last-write-wins with a warning log."
    # jdbc — persistence
    - "FR-05 SimpleJdbcExecutor: try-with-resources lifecycle, POJO row mapping, PARAMETERIZED STATEMENTS ONLY — no string-concatenation overload exists, making PreparedStatement the enforced SQL-injection defense."
    - "FR-06 JdbcTxRunner: programmatic transactions over a plain DataSource, scoped to non-Spring hosts; Javadoc directs Spring users to Spring's own TransactionTemplate. [GAP] no contract stated — isolation levels, nesting/suspension, savepoints, and which exception types trigger rollback are all undefined."
    - "FR-07 PageRequest / PageResponse<T>: page >= 0, 1 <= size <= maxSize (default 200, configurable), violations throw IllegalArgumentException at construction; sort fields validated against a caller-supplied whitelist for injection-safe ordering; immutable."
    # concurrent
    - "FR-08 CustomThreadPoolFactory: named pools, thread priorities, explicit RejectedExecutionHandler; 0 jcstress anomalies for rejection/shutdown races and graceful shutdown drains within the configured timeout (NFR-05)."
    - "FR-09 AsyncExecutor: CompletableFuture-returning async wrapper over a pre-configured executor with MDC context propagation; submission overhead <= 5 us vs raw supplyAsync (NFR-02)."
    - "FR-10 DistributedLock: INTERFACE ONLY in this module — the Redisson implementation ships separately so core never drags a Redis client (ADR-001); lease time mandatory; no reentrancy promise unless an implementation documents it."
    # security
    - "FR-11 JwtTokenProvider: HS256/RS256 sign/parse/validate on Nimbus JOSE+JWT (ADR-003) with a hardened profile — per-key algorithm allowlist (never HS256 and RS256 on one verifier), alg=none structurally impossible, mandatory exp with configurable clock skew (default 60 s), typ/aud/iss checks on by default, JWKS caching with rate-limited refresh, HS256 secrets under 256 bits rejected at construction."
    - "FR-12 AesEncryptor: AES-256-GCM only, unique random 96-bit IV per operation from SecureRandom, 128-bit auth tag, ECB prohibited; keys via a KeyProvider SPI (env/JCEKS/KMS), never hard-coded; ciphertext envelope v1:{keyId}:{iv}:{ct+tag} enables rotation (decrypt by old key id, re-encrypt with current); CryptoException never leaks javax.crypto internals or partial plaintext; stateless and concurrent. [GAP] no AAD support and no per-key message cap driving the rotation trigger."
    - "FR-13 OutputEncoder: context-aware OUTPUT encoding for XSS across HTML-body, HTML-attribute, JavaScript, and URL contexts (OWASP Java Encoder semantics). Deliberately NOT an input sanitizer — input filtering for XSS is an anti-pattern that manufactures false security; SQL-injection defense lives in FR-05 and allowlist input validation in FR-14."
    # core — validation & monitoring
    - "FR-14 Validator: programmatic wrapper over Jakarta Bean Validation 3.x (jakarta.validation), consistent with the compatibility matrix."
    - "FR-15 ExecutionTimeMetricAspect: AOP timing aspect emitting Micrometer Timers when a registry is present and logging otherwise; the AspectJ/Spring-AOP binding lives in the adapter module, not core."
    - "FR-16 AuditLog: annotation + service recording state-change audit trails (who / when / before-after values). [GAP] NO REDACTION POLICY — as specified this faithfully records secrets and PII into a store typically retained longer and replicated wider than application logs. Needs field-level allowlisting, a @Sensitive opt-out, and an explicit never-capture list."
    # core — error handling (ADR-002)
    - "FR-17 Result<T>: sealed Ok/Err wrapper for EXPECTED business outcomes with map/flatMap/recover/orElseThrow(fn); a failure carries a typed ErrorDetail (code, message, cause); Ok(null) is forbidden — use Result<Void>; immutable."
    - "FR-18 BusinessException: UNCHECKED (extends RuntimeException) base for rule violations that abort the use case, carrying the same ErrorDetail type (ADR-002 records why checked exceptions lose here). Rule of thumb: if the caller is expected to branch on it, it is Result.Err; if only a boundary handler cares, it is thrown."
    - "FR-19 GlobalExceptionHandler: Spring MVC advice mapping exceptions to RFC 7807 application/problem+json; lives in the Spring adapter module; normative mapping table — BusinessException -> 422, validation -> 400, StrategyNotFoundException -> 500 + alert, fallback -> 500."
    # json / core — utilities & conversion
    - "FR-20 JsonMapper: pre-configured Jackson (JavaTimeModule, FAIL_ON_UNKNOWN_PROPERTIES=false, NO default typing — the polymorphic-deserialization CVE class is configured away); isolated in the json module so Jackson stays optional for core consumers."
    - "FR-21 ObjectMapperExtensions: deep-conversion and partial-mapping helpers. [GAP] operation list, null-vs-absent semantics, and collection/generic handling are unspecified."
    - "FR-22 StringCaseConverter: camelCase / snake_case / kebab-case conversion. [GAP] edge cases undefined — acronym runs (HTTPServer), embedded digits, and non-ASCII input need pinned table-driven expectations."
    - "FR-23 ObjectUtils: null-safe comparison and validation helpers. [GAP] the helper set is not enumerated, so there is nothing specific to test."
    - "FR-24 ResourceLoaderUtils: classpath resource loading. [GAP] behavior across exploded-directory vs JAR vs JPMS-encapsulated resources, and the missing-resource contract, are unspecified."
    - "FR-25 ReflectionUtils: TEST-SCOPED reflection helpers in the test module; on JDK 9+ setAccessible against a non-opened module throws InaccessibleObjectException, so the module documents required --add-opens test JVM args and the helpers fail with an actionable message when absent; production code importing the test module fails the CI dependency check."

  nonfunctional_reqs:
    - "NFR-01 performance: Lazy.get() steady state <= 2 ns/op on the volatile-read path, AND 0 jcstress anomalous states for the initialization race (JMH + jcstress)."
    - "NFR-02 performance: AsyncExecutor submission overhead <= 5 us vs raw CompletableFuture.supplyAsync (JMH)."
    - "NFR-03 performance: SimpleJdbcExecutor row-mapping overhead <= 10% vs a hand-written ResultSet loop (H2 in-memory, 10k rows) (JMH)."
    - "NFR-04 performance: StrategyRegistry.find <= 50 ns/op at 1k strategies under 8-thread read load (JMH)."
    - "NFR-05 correctness: CustomThreadPoolFactory pools show 0 jcstress anomalies for rejection/shutdown races; graceful shutdown drains within the configured timeout (jcstress + integration test)."
    - "NFR-06 performance/security: AesEncryptor >= 400 MB/s AES-256-GCM on the reference machine (AES-NI), plus an IV-uniqueness property test over 10^7 operations (JMH + property test)."
    - "NFR-07 compatibility: JDK 17 baseline (--release 17) with 21 exercised in CI; jakarta.* namespace only (Bean Validation 3.x); Spring Boot 3.2+ supported in the adapter module only; JDK 8/11 and javax.* explicitly out of scope; every module ships module-info (JPMS)."
    - "NFR-08 dependency policy: core has ZERO third-party dependencies (jakarta.validation-api as provided); Spring, Jackson, and Redisson types never appear in the public APIs of core/jdbc/concurrent; arrows point toward core only, no cycles. Enforced by maven-enforcer, so a PR leaking com.fasterxml into core fails the build rather than review."
    - "NFR-09 binary compatibility: japicmp guards binary compatibility per module against the previous release; the BOM is the consumer-facing versioning contract; SemVer with enforcement teeth."
    - "NFR-10 quality gates: JaCoCo line coverage >= 85%; PIT mutation score >= 60% on the core and security modules."
    - "NFR-11 security posture: OWASP Dependency-Check runs per PR; RFC 7515/7519 and NIST test vectors plus negative tests (alg-confusion, alg=none, expired, wrong-audience) live in the security suite. [GAP] no CVSS failing threshold or suppression-file policy is stated, so the scan is a report rather than a gate."
    - "NFR-12 release integrity: Maven Central publication via Sonatype with GPG-signed artifacts, sources and javadoc JARs, and the reproducible-build plugin; release notes generated from conventional commits. [GAP] no build provenance/attestation (SLSA or Sigstore) and no pinned CI action SHAs."

  # Typed budgets (#249) for the numeric axes above. Note: domains/software.yaml declares ALL four
  # axes hard_budget:false, so the `nfr-budgets` gate does NOT require these — they are recorded
  # anyway so the numbers are machine-checkable instead of prose. `measured` stays absent until a
  # real JMH run produces one (a budget is a number, not a promise).
  nfr_budgets:
    - { axis: performance, metric: "lazy-get-steady-state",     target: 2,   unit: "ns/op" }
    - { axis: performance, metric: "async-submission-overhead", target: 5,   unit: "us" }
    - { axis: performance, metric: "jdbc-row-mapping-overhead", target: 10,  unit: "percent" }
    - { axis: performance, metric: "strategy-registry-find",    target: 50,  unit: "ns/op" }
    - { axis: performance, metric: "aes-gcm-throughput",        target: 400, unit: "MB/s" }
    - { axis: portability, metric: "jdk-baseline",              target: 17,  unit: "major-version" }

  architecture: |
    Maven multi-module reactor (ADR-001). Framework independence is structural: a zero-dependency
    core, capability modules that own their third-party surface, and adapters that isolate hosts.

      core                 [ZERO third-party deps; jakarta.validation-api as provided]
                            FR-01..04, FR-14..18, FR-22..24
      jdbc        -> core  [JDBC API only, no drivers]            FR-05..07
      concurrent  -> core  [no third-party deps]                  FR-08..10
      security    -> core  [compile: nimbus-jose-jwt]             FR-11..13
      json        -> core  [compile: jackson-databind + jsr310]   FR-20..21
      spring-adapter -> core, json  [provided: spring-web, spring-context, aspectj]  FR-19, FR-15 binding
      lock-redisson  -> concurrent  [compile: redisson]           FR-10 implementation
      test           -> core        [test scope only]             FR-25
      bom                           [consumer-facing versioning contract]

    Rules, CI-enforced by maven-enforcer + japicmp:
      * arrows point toward core only; no cycles
      * Spring/Jackson/Redisson types never appear in core/jdbc/concurrent public APIs
      * every module ships module-info (JPMS); the test module documents its --add-opens needs

    LAYOUT — RESOLVED by ADR-004 (.spec/adr/d4np_java_adr_004_generated_layout.md; status ACCEPTED by
    the owner @danielPoloWork on 2026-07-26 — this note previously read "Proposed, awaiting the owner",
    which was stale). The 9-artifact reactor cannot be expressed inside EADOS's single flat source
    tree, because a Maven module is a directory with its own pom.xml — so src/main/java/it/d4np/util/core
    would be a PACKAGE, not a module, collapsing the reactor into the one JAR ADR-001 exists to prevent.
    Decision: scaffold renders the governance layer plus one tree; Milestone 1 item 1.1 then establishes
    the reactor and relocates that tree to become the `core` module's source root. Therefore read
    src_main as CORE's package root, not the repository's only source root. Item 1.1 is a hard
    prerequisite for M2, and NFR-08/NFR-09 enforcement is downstream of it.

  # Q5.4: a LIBRARY commits to no application architecture style — it exposes an API, not an app.
  # Deliberately blank per the interview protocol, not an omission. ADR-001's modular structure is
  # a dependency policy, not an app architecture style.
  architecture_style: ""

  patterns:
    - { name: "Abstract Factory / keyed factory", why: "FR-01 GenericFactory — construction by key without exposing concrete types" }
    - { name: "Builder (fluent)",                 why: "FR-02 FluentBuilder — readable construction of multi-field domain objects" }
    - { name: "Strategy + Registry",              why: "FR-04 StrategyRegistry — runtime strategy selection with an explicit missing-key contract" }
    - { name: "Lazy initialization",              why: "FR-03 Lazy — deferred, once-only, safely published initialization" }
    - { name: "Result / Either",                  why: "FR-17 Result<T> — expected business outcomes as values instead of control flow (ADR-002)" }
    - { name: "Service Provider Interface",       why: "FR-12 KeyProvider and FR-10 DistributedLock — substitutable implementations behind an interface (ADR-001)" }
    - { name: "Adapter",                          why: "spring-adapter and lock-redisson — host/framework coupling confined to the edge" }
    - { name: "Template method / callback",       why: "FR-05 SimpleJdbcExecutor and FR-06 JdbcTxRunner — the library owns the resource lifecycle, the caller supplies the body" }
    - { name: "Decorator (aspect)",               why: "FR-15 ExecutionTimeMetricAspect — timing added without touching the measured code" }

  # Q5.4 posture: CONFIRMED `enforced` by the maintainer 2026-07-26 (the imported document did not
  # settle it). Conformance to the architecture rules and the adopted patterns above is a REVIEW
  # EXPECTATION, not advice — consistent with posture:enterprise and with the project's own
  # precedent that ADR-001's dependency rules are CI-enforced rather than review-enforced.
  # Consequence to carry into scaffold: the generated review checklist and docs/patterns/README.md
  # must state the adopted patterns as binding, and a PR departing from one needs a stated reason.
  pattern_discipline: enforced

  # Q5.4a: not offered — a library keeps the flat shape. The module split is Maven-level, not a
  # controller/service/repository layering.
  layers: []

  public_api:
    - "Lazy<T>: get() non-null (initializer returning null -> IllegalStateException); initializer-exception policy per option; safe publication guaranteed (jcstress)."
    - "StrategyRegistry<K,S>: find(K) -> Optional<S>, getOrThrow(K) -> S or StrategyNotFoundException listing known keys; never returns null; fully concurrent; register is last-write-wins with a warning log."
    - "PageRequest.of(page, size, sort) / PageResponse<T>: non-null args; IllegalArgumentException on bounds or sort-whitelist violation at construction; immutable."
    - "Result<T> (sealed Ok|Err): map, flatMap, recover, orElseThrow(fn); Ok(null) forbidden; failures carry ErrorDetail(code, message, cause); immutable."
    - "BusinessException (unchecked) + ErrorDetail: the shared error vocabulary across both channels and the problem+json wire format."
    - "AesEncryptor.encrypt/decrypt: non-null; CryptoException never leaks javax.crypto internals or partial plaintext; stateless and concurrent; envelope v1:{keyId}:{iv}:{ct+tag}."
    - "JwtTokenProvider: sign/parse/validate under the ADR-003 hardened profile; raw Nimbus types never leak from the API, so an implementation swap stays an internal change."
    - "SimpleJdbcExecutor / JdbcTxRunner: parameterized statements only; no string-concatenation overload is offered."
    - "SemVer surface: a MAJOR bump is any binary-incompatible change japicmp flags in a published module, any package-root change, or any raise of the JDK baseline. The BOM is the single import consumers pin."
    - "[GAP] Only 5 of ~25 public types carry a nullability/error/thread-safety contract row (spec section 5). The remaining types need the same treatment before freeze."

  verification: |
    Benchmarks: JMH 1.37+, forked JVMs, 5x10 warmup/measurement iterations, Blackhole to defeat
    dead-code elimination; harnesses committed under bench/. Reference machine Ryzen 7 5800X on
    JDK 21. Nightly CI tracks results and fails a > 10% regression.

    Concurrency: every thread-safety claim is backed by a NAMED jcstress test (harnesses under
    jcstress/), reduced iterations per PR and the full suite nightly. A claim without a jcstress
    test is not a claim — this is the rule that replaces v1's unverified "no deadlocks" assertion.

    Functional: JUnit 5 across the CI matrix (JDK 17 + 21); H2 in-memory for JDBC; RFC 7515/7519
    and NIST test vectors for JWT/AES plus negative tests (alg-confusion, alg=none, expired token,
    wrong audience); an IV-uniqueness property test over 10^7 operations.

    Gates: JaCoCo line coverage >= 85%; PIT mutation >= 60% on core and security; maven-enforcer
    for dependency convergence and the banned-dependency rules; japicmp for per-module binary
    compatibility; OWASP Dependency-Check per PR; a CI check failing production code that imports
    the test module.

    Release: SemVer; Maven Central via Sonatype with GPG-signed artifacts, sources + javadoc JARs,
    and the reproducible-build plugin; release notes generated from conventional commits.

    [GAP] Reproducibility of the absolute budgets: NFR-01 (<= 2 ns/op) and NFR-06 (>= 400 MB/s) are
    stated against a named reference machine, but GitHub-hosted runners vary far more than 10% in
    both CPU model and steal time. As written these gates will be flaky. Resolve by pinning the
    perf gate to a self-hosted runner, or by comparing against a stored per-runner baseline rather
    than an absolute number. NFR-01 additionally sits near JMH's measurement noise floor.

  milestone1_items:
    - "1.1 Maven reactor skeleton: parent POM, the nine modules from ADR-001, and the BOM — relocating the rendered tree to become the core module's source root, AND updating every generated src_main/src_test/src_bench reference plus the consistency_lint.py path assertions in the same item (ADR-004). Hard prerequisite for M2: no component code lands before the reactor exists."
    - "Per-module module-info.java (JPMS) with the test module's --add-opens documented"
    - "maven-enforcer wired with the ADR-001 banned-dependency and convergence rules"
    - "JMH (bench/) and jcstress (jcstress/) harness skeletons so NFR gates have somewhere to land"
    - "SECURITY.md with a coordinated-disclosure policy, and .github/CODEOWNERS"

  # Q5.7 roadmap: the imported document carried NO roadmap, so this was the one Phase-5 question the
  # import could not answer. Drafted by the agent, ordered by the ADR-001 dependency DAG (core
  # first, then the capability leaves, then adapters, then release), and CONFIRMED AS DRAFTED by the
  # maintainer on 2026-07-26 — so it is settled, not provisional. Each audit gap is scheduled into
  # the milestone that owns it (contract gaps in M2/M3/M4, the perf-runner gap in 8.3, the
  # supply-chain gap in 8.5, the threat model in 8.6) rather than tracked separately.
  milestones:
    - number: 2
      title: "core foundations"
      goal: "Zero-dependency core: creational/structural patterns plus the ADR-002 error model."
      items:
        - "2.1 Result<T> sealed Ok/Err, ErrorDetail, unchecked BusinessException (FR-17, FR-18)"
        - "2.2 Lazy<T> with the jcstress harness proving safe publication (FR-03, NFR-01)"
        - "2.3 StrategyRegistry<K,S> with the find/getOrThrow contract (FR-04, NFR-04)"
        - "2.4 GenericFactory<T,K> and FluentBuilder<T> — contracts defined first (FR-01, FR-02)"
        - "2.5 StringCaseConverter, ObjectUtils, ResourceLoaderUtils with pinned edge-case tables (FR-22..24)"
    - number: 3
      title: "core cross-cutting"
      goal: "Validation, metrics, and an audit trail that cannot leak secrets."
      items:
        - "3.1 Validator over Jakarta Bean Validation 3.x (FR-14)"
        - "3.2 ExecutionTimeMetricAspect with Micrometer-or-log fallback (FR-15)"
        - "3.3 AuditLog with a field-level redaction allowlist and @Sensitive opt-out (FR-16)"
    - number: 4
      title: "json and jdbc"
      goal: "Persistence and serialization capability modules, each owning its third-party surface."
      items:
        - "4.1 JsonMapper hardened configuration, default typing off (FR-20)"
        - "4.2 ObjectMapperExtensions once the operation set is specified (FR-21)"
        - "4.3 SimpleJdbcExecutor, parameterized-only by construction (FR-05, NFR-03)"
        - "4.4 JdbcTxRunner once isolation/rollback semantics are specified (FR-06)"
        - "4.5 PageRequest/PageResponse with whitelist-validated sorting (FR-07)"
    - number: 5
      title: "concurrent"
      goal: "Pooling and async execution with concurrency claims proven, not asserted."
      items:
        - "5.1 CustomThreadPoolFactory plus rejection/shutdown jcstress harness (FR-08, NFR-05)"
        - "5.2 AsyncExecutor with MDC propagation and the overhead benchmark (FR-09, NFR-02)"
        - "5.3 DistributedLock interface only, lease-time mandatory (FR-10)"
    - number: 6
      title: "security"
      goal: "JWT and cryptography under the hardened profiles the ADRs pin."
      items:
        - "6.1 JwtTokenProvider on Nimbus with the ADR-003 hardened profile and negative tests (FR-11)"
        - "6.2 AesEncryptor AES-256-GCM with the rotation envelope, AAD, and a per-key message cap (FR-12, NFR-06)"
        - "6.3 OutputEncoder delegating to OWASP Java Encoder rather than reimplementing it (FR-13)"
        - "6.4 Dependency-Check CVSS threshold and suppression policy turned into a real gate (NFR-11)"
    - number: 7
      title: "adapters and test support"
      goal: "Confine host coupling to the edge; ship the test-scoped helpers safely."
      items:
        - "7.1 spring-adapter: GlobalExceptionHandler with the RFC 7807 mapping table (FR-19)"
        - "7.2 spring-adapter: AOP/DI binding for the metrics aspect (FR-15 binding)"
        - "7.3 lock-redisson: Redisson DistributedLock implementation with container-based integration tests"
        - "7.4 test module: ReflectionUtils with the --add-opens contract and the production-import CI check (FR-25)"
    - number: 8
      title: "release engineering"
      goal: "Make the compatibility and supply-chain contracts enforceable, then publish."
      items:
        - "8.1 japicmp per-module binary-compatibility gate against the previous release (NFR-09)"
        - "8.2 JaCoCo >= 85% and PIT >= 60% enforced on core and security (NFR-10)"
        - "8.3 Perf gates pinned to a stable runner or a per-runner baseline (resolves the NFR-01/06 gap)"
        - "8.4 GPG-signed Maven Central publication, sources + javadoc JARs, reproducible build (NFR-12)"
        - "8.5 Build provenance/attestation and pinned CI action SHAs (NFR-12 gap)"
        - "8.6 Threat model under docs/security/ via /eados audit"

